<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJCOE FabLab - Study Screens</title>
    <style>
        /* Base Styles */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Header & Logo Area */
        header {
            padding: 20px;
        }
        .logo-container {
            display: inline-block;
            margin-bottom: 10px;
        }
        .logo-text {
            font-size: 40px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 2px;
        }
        .logo-text .sjcoe { color: #ffffff; }
        .logo-text .fab-f { color: #ff3b30; }
        .logo-text .fab-a { color: #ff9500; }
        .logo-text .fab-b { color: #ffcc00; }
        .logo-text .lab-l { color: #007aff; }
        .logo-text .lab-a { color: #34c759; }
        .logo-text .lab-b { color: #ff2d95; }
        
        .site-title {
            color: #555555;
            font-size: 36px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 10px 0 30px 0;
        }

        /* Location Sections */
        .location {
            margin-bottom: 60px;
            padding: 0 20px;
        }

        /* Banners */
        .banner {
            width: 100%;
            max-width: 1200px;
            height: 200px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            border: 2px solid #333;
        }
        
        /* Add your banner images here */
        .sf-banner { background-image: url('SF2.png'); }
        .monterey-banner { background-image: url('Monterey.png'); }
        .mv-banner { background-image: url('Mountain View.png'); }
        .tokyo-banner { background-image: url('Tokyo.png'); }
        .moon-banner { background-image: url('Moon.png'); }
        .mars-banner { background-image: url('Mars.png'); }
        .iss-banner { background-image: url('ISS.png'); }
        .dino-banner { background-image: url('Dino.png'); }
        .banner h2 {
            font-size: 80px;
            font-weight: 100;
            margin: 0;
            /* White text with a black outline to match the mock-up */
            color: white;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000;
        }

        /* Media Containers */
        .media-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 40%; /* Adjust ratio as needed */
            height: 0;
            margin-bottom: 20px;
            background-color: #cde2f5; /* Light blue placeholder color from mockup */
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .stills-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .stills-row img {
            width: 32%;
            height: 200px;
            object-fit: cover;
            background-color: #cde2f5;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.3s ease;
        }

        .stills-row img:hover {
            border: 2px solid #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <h1 class="logo-text"><span class="sjcoe">SJCOE</span> <span class="fab-f">F</span><span class="fab-a">a</span><span class="fab-b">b</span><span class="lab-l">L</span><span class="lab-a">a</span><span class="lab-b">b</span></h1>
        </div>
        <h2 class="site-title">Study Screens</h2>
    </header>

    <main>
        <!-- SAN FRANCISCO SECTION -->
        <section class="location">
            <div class="banner sf-banner">
                <h2>San Francisco</h2>
            </div>
            <div class="media-container">
                <!-- Video Section (Replace VIDEO_ID with your YouTube video ID) -->
                <!-- Note: ?loop=1&playlist=VIDEO_ID is required by YouTube to loop a single video -->
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/urVW36rIHYM?loop=1&playlist=urVW36rIHYM" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/KFai6k5qqjw?loop=1&playlist=KFai6k5qqjw" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/79FcZFpD-qA?loop=1&playlist=79FcZFpD-qA" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/G8RIAgPxaMc?loop=1&playlist=G8RIAgPxaMc" allowfullscreen></iframe>
                </div>
                <!-- Stills Section -->
                <div class="stills-row">
                    <img src="SF/IMG_8021.jpeg" class="fullscreen-able" alt="SF Lake Still">
                    <img src="SF/IMG_8036.jpeg" class="fullscreen-able" alt="SF Bay ViewStill">
                    <img src="SF/IMG_8268.jpeg" class="fullscreen-able" alt="SF Bay Still">
                </div>
            </div>
        </section>

        <!-- MONTEREY SECTION -->
        <section class="location">
            <div class="banner monterey-banner">
                <h2>Monterey</h2>
            </div>
            <div class="media-container">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/9p2Egh6K0yc?loop=1&playlist=9p2Egh6K0yc" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/hjaWwB__7DE?loop=1&playlist=hjaWwB__7DE" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/w3LjpFhySTg?loop=1&playlist=w3LjpFhySTg" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/n_GpVsz4nHU?loop=1&playlist=n_GpVsz4nHU" allowfullscreen></iframe>
                </div>
                <div class="stills-row">
                    <img src="Monterey/octopus.png" class="fullscreen-able" alt="Octopus-Monterey Still">
                    <img src="Monterey/kelp.png" class="fullscreen-able" alt="Kelp Forest - Monterey Still">
                    <img src="Monterey/otters.png" class="fullscreen-able" alt="Otter - Monterey Still">
                </div>
            </div>
        </section>

        <!-- TOKYO SECTION -->
        <section class="location">
            <div class="banner tokyo-banner">
                <h2>Tokyo</h2>
            </div>
            <div class="media-container">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/K8OSCPfAN54?loop=1&playlist=K8OSCPfAN54" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/f8biXsnWJS0?loop=1&playlist=f8biXsnWJS0" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/VTeBPXvD7LE?loop=1&playlist=VTeBPXvD7LE" allowfullscreen></iframe>
                </div>
                <div class="stills-row">
                    <img src="Tokyo/FishMarket.jpg" class="fullscreen-able" alt="Tokyo Fish Market">
                    <img src="Tokyo/skyline.avif" class="fullscreen-able" alt="Tokyo skyline">
                    <img src="Tokyo/bridge.avif" class="fullscreen-able" alt="Tokyo Bridge">
                </div>
            </div>
        </section>
        
        <!-- Mars SECTION -->
        <section class="location">
            <div class="banner mars-banner">
                <h2>Mars</h2>
            </div>
            <div class="media-container">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/GHenFGnixzU?loop=1&playlist=GHenFGnixzU" allowfullscreen></iframe>
                </div>
                <div class="stills-row">
                    <img src="mars/MIT-MissMars-01-press_0.jpg" class="fullscreen-able" alt="Mars Red Dirt Still">
                    <img src="mars/Perseverance1.png" class="fullscreen-able" alt="Mars Perseverance Camara Shot Still">
                    <img src="mars/Perseverance2.png" class="fullscreen-able" alt="Mars Perseverance Camara Shot 2 Still">
                </div>
            </div>
        </section>
        
        <!-- ISS SECTION -->
        <section class="location">
            <div class="banner iss-banner">
                <h2>International Space Station</h2>
            </div>
            <div class="media-container">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/WxL-TAd7enU?loop=1&playlist=WxL-TAd7enU" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/5TnXCILNVV0?loop=1&playlist=5TnXCILNVV0" allowfullscreen></iframe>
                </div>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/WxL-TAd7enU?loop=1&playlist=WxL-TAd7enU" allowfullscreen></iframe>
                </div>
                <div class="stills-row">
                    <img src="ISS/issview1.jpg" class="fullscreen-able" alt="ISS Still, view of the planet">
                    <img src="ISS/issview2.jpg" class="fullscreen-able" alt="ISS Still, view of earth">
                    <img src="ISS/issview3.jpg" class="fullscreen-able" alt="ISS Still, view of storm">
                </div>
            </div>
        </section>
        
        <!-- DINO Park SECTION -->
        <section class="location">
            <div class="banner dino-banner">
                <h2>Dinosaur Park</h2>
            </div>
            <div class="media-container">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/nZUMdnky11E?loop=1&playlist=nZUMdnky11E" allowfullscreen></iframe>
                </div>
                <div class="stills-row">
                    <img src="dino/dino1.png" class="fullscreen-able" alt="Dinosaurs Still">
                    <img src="dino/dino2.png" class="fullscreen-able" alt="Dinosaurs Still">
                    <img src="dino/dino3.png" class="fullscreen-able" alt="Dinosaurs Still">
                </div>
            </div>
        </section>
        
    </main>

    <!-- JavaScript for Fullscreen Functionality -->
    <script>
        // Select all images with the 'fullscreen-able' class
        const fullscreenImages = document.querySelectorAll('.fullscreen-able');

        fullscreenImages.forEach(img => {
            img.addEventListener('click', () => {
                // Check for fullscreen API support across different browsers
                if (img.requestFullscreen) {
                    img.requestFullscreen();
                } else if (img.webkitRequestFullscreen) { /* Safari */
                    img.webkitRequestFullscreen();
                } else if (img.msRequestFullscreen) { /* IE11 */
                    img.msRequestFullscreen();
                }
            });
        });
    </script>
</body>
</html>
